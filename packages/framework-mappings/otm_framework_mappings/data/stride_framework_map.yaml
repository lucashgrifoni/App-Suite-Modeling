# Mapeamento funcional STRIDE → referências (MVP).
# IDs ASVS alinhados a OWASP ASVS 4.0.3; NIST CSF 2.0; ISO/IEC 27001:2022 Annex A.
# OWASP TM: categorização metodológica (Cheat Sheet / guia STRIDE), não um ID normativo único.
# CAPEC/CWE: padrões de ataque (MITRE CAPEC) e fraquezas (MITRE CWE) por categoria STRIDE,
#   para rastreabilidade (STRIDE → CAPEC → CWE). Mapeamento ao nível da categoria (não por
#   ameaça específica); assistivo, não exaustivo. control_id é o identificador canónico
#   (ex.: CAPEC-151 -> capec.mitre.org/data/definitions/151.html; CWE-287 -> cwe.mitre.org).

version: "1"

by_stride:
  spoofing:
    - framework: owasp_tm
      control_id: STRIDE-S
      notes: "Tratar falsificação de identidade na matriz STRIDE e no diagrama (OWASP Threat Modeling Cheat Sheet)."
    - framework: capec
      control_id: CAPEC-151
      notes: "Identity Spoofing — falsificação de identidade de um ator ou componente (MITRE CAPEC-151)."
    - framework: cwe
      control_id: CWE-287
      notes: "Improper Authentication — autenticação ausente ou insuficiente (MITRE CWE-287)."
    - framework: owasp_asvs
      control_id: V2.2.1
      notes: "Verificação de identidade reforçada (MFA onde aplicável) — ASVS V2 Authentication."
    - framework: owasp_asvs
      control_id: V3.2.1
      notes: "Gestão de sessão e vinculação a utilizador — ASVS V3."
    - framework: nist_csf
      control_id: PR.AA-01
      notes: "Identidades e credenciais são geridos por pessoal autorizado (NIST CSF 2.0 PR.AA)."
    - framework: nist_csf
      control_id: PR.AA-05
      notes: "Acesso a ativos é limitado a pessoas, processos e dispositivos autorizados."
    - framework: iso_27001
      control_id: A.8.5
      notes: "Autenticação segura (ISO/IEC 27001:2022 A.8.5)."
    - framework: iso_27001
      control_id: A.5.16
      notes: "Gestão de identidades (A.5.16)."

  tampering:
    - framework: owasp_tm
      control_id: STRIDE-T
      notes: "Modelar alteração não autorizada de dados ou fluxos (STRIDE Tampering)."
    - framework: capec
      control_id: CAPEC-184
      notes: "Software Integrity Attack — adulteração da integridade de software/dados (MITRE CAPEC-184)."
    - framework: cwe
      control_id: CWE-345
      notes: "Insufficient Verification of Data Authenticity — verificação de autenticidade insuficiente (MITRE CWE-345)."
    - framework: owasp_asvs
      control_id: V5.1.1
      notes: "Validação de entrada e integridade — ASVS V5 Validation, Sanitization and Encoding."
    - framework: owasp_asvs
      control_id: V14.1.1
      notes: "Ambiente de build e dependências — ASVS V14 Configuration."
    - framework: nist_csf
      control_id: PR.DS-01
      notes: "Confidencialidade, integridade e disponibilidade dos dados em repouso (NIST CSF 2.0 PR.DS-01)."
    - framework: nist_csf
      control_id: PR.PS-01
      notes: "Configuração e manutenção de componentes de infraestrutura (PR.PS)."
    - framework: iso_27001
      control_id: A.8.9
      notes: "Gestão de configuração (A.8.9)."
    - framework: iso_27001
      control_id: A.8.12
      notes: "Prevenção de fuga de dados (relevante a integridade em canais — A.8.12)."

  repudiation:
    - framework: owasp_tm
      control_id: STRIDE-R
      notes: "Avaliar se atores podem negar ações; ligar a logging e auditoria."
    - framework: capec
      control_id: CAPEC-93
      notes: "Log Injection-Tampering-Forging — manipulação de registos que permite repúdio (MITRE CAPEC-93)."
    - framework: cwe
      control_id: CWE-778
      notes: "Insufficient Logging — registo de eventos de segurança insuficiente (MITRE CWE-778)."
    - framework: owasp_asvs
      control_id: V7.1.1
      notes: "Registo de eventos de segurança — ASVS V7 Error Handling and Logging."
    - framework: nist_csf
      control_id: PR.PS-04
      notes: "Registos de atividades são criados e mantidos (NIST CSF 2.0 PR.PS)."
    - framework: nist_csf
      control_id: DE.CM-03
      notes: "Atividades de pessoal são monitorizadas para comportamento anómalo (DE.CM)."
    - framework: iso_27001
      control_id: A.8.15
      notes: "Registo de eventos (A.8.15)."
    - framework: iso_27001
      control_id: A.8.15
      notes: "Registo de acessos (A.8.15)."

  information_disclosure:
    - framework: owasp_tm
      control_id: STRIDE-I
      notes: "Expor dados sensíveis no modelo e controlos de confidencialidade."
    - framework: capec
      control_id: CAPEC-118
      notes: "Collect and Analyze Information — recolha de informação exposta (MITRE CAPEC-118)."
    - framework: cwe
      control_id: CWE-200
      notes: "Exposure of Sensitive Information to an Unauthorized Actor (MITRE CWE-200)."
    - framework: owasp_asvs
      control_id: V8.3.1
      notes: "Proteção de dados sensíveis em repouso — ASVS V8 Data Protection."
    - framework: owasp_asvs
      control_id: V9.1.1
      notes: "Comunicações seguras com TLS — ASVS V9 Communication."
    - framework: nist_csf
      control_id: PR.DS-01
      notes: "Dados em repouso são protegidos (PR.DS)."
    - framework: nist_csf
      control_id: PR.DS-02
      notes: "Dados em trânsito são protegidos."
    - framework: iso_27001
      control_id: A.8.24
      notes: "Utilização de criptografia (A.8.24)."
    - framework: iso_27001
      control_id: A.5.14
      notes: "Transferência de informação (A.5.14)."

  denial_of_service:
    - framework: owasp_tm
      control_id: STRIDE-D
      notes: "Disponibilidade e abuso de recursos no modelo de ameaças."
    - framework: capec
      control_id: CAPEC-125
      notes: "Flooding — exaustão de recursos por inundação (MITRE CAPEC-125)."
    - framework: cwe
      control_id: CWE-400
      notes: "Uncontrolled Resource Consumption — consumo de recursos sem limite (MITRE CWE-400)."
    - framework: owasp_asvs
      control_id: V11.1.1
      notes: "Lógica de negócio e quotas — ASVS V11 Business Logic."
    - framework: nist_csf
      control_id: PR.IR-01
      notes: "Resiliência de infraestruturas e recursos (NIST CSF 2.0 PR.IR)."
    - framework: iso_27001
      control_id: A.8.6
      notes: "Gestão de capacidade (A.8.6)."
    - framework: iso_27001
      control_id: A.8.14
      notes: "Redundância de recursos de tratamento de informação (A.8.14)."

  elevation_of_privilege:
    - framework: owasp_tm
      control_id: STRIDE-E
      notes: "Rever superfícies de autorização e escalação no diagrama."
    - framework: capec
      control_id: CAPEC-233
      notes: "Privilege Escalation — obtenção de privilégios acima dos autorizados (MITRE CAPEC-233)."
    - framework: cwe
      control_id: CWE-269
      notes: "Improper Privilege Management — gestão de privilégios incorreta (MITRE CWE-269)."
    - framework: owasp_asvs
      control_id: V4.1.1
      notes: "Controlos de acesso — ASVS V4 Access Control."
    - framework: owasp_asvs
      control_id: V4.2.1
      notes: "Operações com permissão explícita por política."
    - framework: nist_csf
      control_id: PR.AA-01
      notes: "Identidades e credenciais são geridas ao longo do ciclo de vida (NIST CSF 2.0 PR.AA-01)."
    - framework: nist_csf
      control_id: PR.AA-05
      notes: "Permissões e autorizações seguem o princípio do menor privilégio (NIST CSF 2.0 PR.AA-05)."
    - framework: iso_27001
      control_id: A.8.2
      notes: "Direitos de acesso privilegiado (A.8.2)."
    - framework: iso_27001
      control_id: A.8.3
      notes: "Restrição de acesso à informação (A.8.3)."
