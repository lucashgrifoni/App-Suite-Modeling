# Mapeamento funcional por id de heurística → referências da lente de IA.
#
# Complementa (não substitui) o mapa STRIDE `stride_framework_map.yaml`: as
# heurísticas `plot4ai_*` recebem primeiro os refs da sua categoria STRIDE e,
# adicionalmente, os refs específicos de IA definidos aqui.
#
# owasp_llm : OWASP Top 10 for LLM Applications 2025 (identificador oficial,
#             ex.: LLM01:2025 -> genai.owasp.org/llm-top-10). Lista confirmada:
#             LLM01 Prompt Injection, LLM02 Sensitive Information Disclosure,
#             LLM03 Supply Chain, LLM04 Data and Model Poisoning,
#             LLM05 Improper Output Handling, LLM06 Excessive Agency,
#             LLM07 System Prompt Leakage, LLM08 Vector and Embedding Weaknesses,
#             LLM09 Misinformation, LLM10 Unbounded Consumption.
# mitre_atlas : MITRE ATLAS techniques (ex.: AML.T0051 -> atlas.mitre.org).
#             Nomes conforme `mitre-atlas/atlas-data` (dist/ATLAS.yaml), a fonte
#             canónica — a MITRE renomeou algumas técnicas de "ML" para "AI".
#             Incluídas apenas técnicas com id verificado: AML.T0051
#             (LLM Prompt Injection), AML.T0024 (Exfiltration via AI Inference
#             API), AML.T0034 (Cost Harvesting).
#
# Mapeamento assistivo ao nível da heurística; rastreabilidade, não exaustivo.

version: "1"

by_heuristic:
  plot4ai_prompt_injection:
    - framework: owasp_llm
      control_id: "LLM01:2025"
      notes: "Prompt Injection — entradas maliciosas subvertem políticas do modelo (OWASP LLM Top 10 2025)."
    - framework: mitre_atlas
      control_id: AML.T0051
      notes: "LLM Prompt Injection — instruções adversárias diretas/indiretas (MITRE ATLAS)."

  plot4ai_prompt_input_handling:
    - framework: owasp_llm
      control_id: "LLM01:2025"
      notes: "Prompt Injection — validação/guardrails de entrada insuficientes (OWASP LLM Top 10 2025)."
    - framework: mitre_atlas
      control_id: AML.T0051
      notes: "LLM Prompt Injection — normalização e defesa de input (MITRE ATLAS)."

  plot4ai_sensitive_prompt_surface:
    - framework: owasp_llm
      control_id: "LLM02:2025"
      notes: "Sensitive Information Disclosure — dados sensíveis no contexto de prompt (OWASP LLM Top 10 2025)."
    - framework: owasp_llm
      control_id: "LLM07:2025"
      notes: "System Prompt Leakage — exposição de instruções/segredos do sistema via prompt (OWASP LLM Top 10 2025)."

  plot4ai_rag_data_leakage:
    - framework: owasp_llm
      control_id: "LLM08:2025"
      notes: "Vector and Embedding Weaknesses — vazamento/quebra de isolamento em RAG/embeddings (OWASP LLM Top 10 2025)."
    - framework: owasp_llm
      control_id: "LLM02:2025"
      notes: "Sensitive Information Disclosure — contexto recuperado expõe dados sensíveis (OWASP LLM Top 10 2025)."

  plot4ai_retrieval_grounding:
    - framework: owasp_llm
      control_id: "LLM08:2025"
      notes: "Vector and Embedding Weaknesses — grounding fraco em retrieval/RAG (OWASP LLM Top 10 2025)."

  plot4ai_rag_vector_composition:
    - framework: owasp_llm
      control_id: "LLM08:2025"
      notes: "Vector and Embedding Weaknesses — isolamento de índices e política de ingestão (OWASP LLM Top 10 2025)."

  plot4ai_grounding_attribution_weak:
    - framework: owasp_llm
      control_id: "LLM09:2025"
      notes: "Misinformation — atribuição/citação fraca aumenta risco de respostas não confiáveis (OWASP LLM Top 10 2025)."
    - framework: owasp_llm
      control_id: "LLM08:2025"
      notes: "Vector and Embedding Weaknesses — qualidade e proveniência do contexto recuperado (OWASP LLM Top 10 2025)."

  plot4ai_model_abuse:
    - framework: owasp_llm
      control_id: "LLM10:2025"
      notes: "Unbounded Consumption — abuso de inferência, custo e disponibilidade (OWASP LLM Top 10 2025)."
    - framework: mitre_atlas
      control_id: AML.T0034
      notes: "Cost Harvesting — elevar custo do serviço de IA além da capacidade normal (MITRE ATLAS, tática Impact)."
    - framework: mitre_atlas
      control_id: AML.T0024
      notes: "Exfiltration via AI Inference API — extração de comportamento/modelo via API de inferência (MITRE ATLAS)."

  plot4ai_agent_tool_execution:
    - framework: owasp_llm
      control_id: "LLM06:2025"
      notes: "Excessive Agency — tool-use de agente sem isolamento pode executar ações fora de escopo (OWASP LLM Top 10 2025)."

  plot4ai_agent_external_toolchain:
    - framework: owasp_llm
      control_id: "LLM06:2025"
      notes: "Excessive Agency — reduzir blast radius e exigir confirmação humana em integrações externas (OWASP LLM Top 10 2025)."

  plot4ai_governance_pipeline:
    - framework: owasp_llm
      control_id: "LLM04:2025"
      notes: "Data and Model Poisoning — versionamento, aprovação e rastreabilidade do pipeline de modelo (OWASP LLM Top 10 2025)."
    - framework: owasp_llm
      control_id: "LLM03:2025"
      notes: "Supply Chain — integridade e proveniência de artefactos/dados do pipeline de IA (OWASP LLM Top 10 2025)."

  plot4ai_observability_gap:
    - framework: owasp_llm
      control_id: "LLM06:2025"
      notes: "Excessive Agency — mitigação exige logging/observabilidade e trilhos auditáveis das ações do agente (OWASP LLM Top 10 2025)."

  plot4ai_third_party_model_dependency:
    - framework: owasp_llm
      control_id: "LLM03:2025"
      notes: "Supply Chain — dependência de fornecedor/endpoint de inferência terceiro (OWASP LLM Top 10 2025)."
