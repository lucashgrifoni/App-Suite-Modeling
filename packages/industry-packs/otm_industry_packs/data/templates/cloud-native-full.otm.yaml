model:
  schema_version: 1.0.0
  methodology: stride
  system_type: hybrid
  industry_sector: cloud_native
metadata:
  title: Cloud-native completo
  summary: Ingress, workloads, cache, dados e telemetria.
  tags:
  - template
  - k8s
business_context:
  description: Superfície de rede interna e externa com stack de observabilidade.
  assumptions:
  - Prometheus/OTel para métricas e traces.
trust_boundaries:
- id: internet
  name: Internet
- id: dmz
  name: DMZ / edge
  member_component_ids:
  - ingress
- id: app_tier
  name: Aplicação / dados
  member_component_ids:
  - svc
  - cache
  - db
  - obs
components:
- id: user
  name: Cliente
  kind: user
  in_trust_boundary: internet
- id: ingress
  name: Ingress / gateway
  kind: gateway
  in_trust_boundary: dmz
- id: svc
  name: Workload principal
  kind: process
  technology: K8s
  in_trust_boundary: app_tier
- id: cache
  name: Cache
  kind: datastore
  technology: Redis
  in_trust_boundary: app_tier
- id: db
  name: Base de dados
  kind: datastore
  technology: PostgreSQL
  in_trust_boundary: app_tier
- id: obs
  name: Stack observabilidade
  kind: process
  technology: OTel
  in_trust_boundary: app_tier
data_flows:
- id: u_in
  from_component: user
  to_component: ingress
  protocol: HTTPS
  encrypted: true
- id: in_sv
  from_component: ingress
  to_component: svc
  protocol: HTTPS
- id: sv_c
  from_component: svc
  to_component: cache
  protocol: TCP
  encrypted: true
- id: sv_d
  from_component: svc
  to_component: db
  protocol: TCP
  encrypted: true
- id: sv_o
  from_component: svc
  to_component: obs
  protocol: HTTPS
assets: []
threats: []
mitigations: []
evidence_suggestions: []
