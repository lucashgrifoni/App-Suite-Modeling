- id: u_edge
  from_component: user
  to_component: edge_api
  protocol: HTTPS
  encrypted: true
- id: edge_q
  from_component: edge_api
  to_component: queue
  protocol: TCP
  encrypted: true
- id: q_w
  from_component: queue
  to_component: worker
  protocol: TCP
- id: w_db
  from_component: worker
  to_component: db
  protocol: TCP
  encrypted: true
- id: w_c
  from_component: worker
  to_component: cache
  protocol: TCP
  encrypted: true
