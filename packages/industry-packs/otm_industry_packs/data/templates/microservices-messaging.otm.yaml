model:
  schema_version: 1.0.0
  methodology: stride
  system_type: hybrid
  industry_sector: generic
metadata:
  title: Microsserviços com mensageria
  summary: Entrada API, fila e workers consumindo mensagens.
  tags:
  - template
  - microservices
  - queue
business_context:
  description: Carga síncrona na borda e trabalho assíncrono atrás de broker.
  assumptions:
  - Broker gerido (SQS/Kafka/RabbitMQ).
  - Workers com política de retry.
trust_boundaries:
- id: internet
  name: Internet
- id: dmz
  name: DMZ / edge
  member_component_ids:
  - edge_api
- id: app_tier
  name: Aplicação / dados
  member_component_ids:
  - queue
  - worker
  - cache
  - db
components:
- id: user
  name: Cliente
  kind: user
  in_trust_boundary: internet
- id: edge_api
  name: API de borda
  kind: gateway
  technology: Gateway
  in_trust_boundary: dmz
- id: queue
  name: Fila / tópico
  kind: queue
  technology: Kafka
  in_trust_boundary: app_tier
- id: worker
  name: Worker
  kind: process
  in_trust_boundary: app_tier
- id: cache
  name: Cache
  kind: datastore
  technology: Redis
  in_trust_boundary: app_tier
- id: db
  name: Base de dados
  kind: datastore
  technology: PostgreSQL
  in_trust_boundary: app_tier
