  kind: process
  in_trust_boundary: app_tier
- id: queue
  name: Fila / stream
  kind: queue
  technology: Kafka
  in_trust_boundary: app_tier
- id: wh
  name: Armazém / lake
  kind: datastore
  technology: Snowflake/S3
  in_trust_boundary: app_tier
data_flows:
- id: i_t
  from_component: ingest
  to_component: transform
