# Template: Kubernetes / cloud-native
model:
  schema_version: "1.0.0"
  system_type: hybrid
  industry_sector: cloud_native

metadata:
  title: "Serviço cloud-native"
  summary: "Ingress, API em contentor, cache e base de dados."
  tags:
    - template
    - kubernetes

trust_boundaries:
  - id: external
    name: "Clientes externos"
  - id: cluster
    name: "Cluster Kubernetes"
    member_component_ids:
      - ingress
      - api
      - cache
      - db

components:
  - id: client
    name: "Cliente"
    kind: external_entity
    in_trust_boundary: external
  - id: ingress
    name: "Ingress / LB"
    kind: gateway
    technology: "Ingress controller"
    in_trust_boundary: cluster
  - id: api
    name: "Workload API"
    kind: process
    technology: "Pods"
    in_trust_boundary: cluster
  - id: cache
    name: "Redis"
    kind: datastore
    in_trust_boundary: cluster
  - id: db
    name: "PostgreSQL"
    kind: datastore
    in_trust_boundary: cluster

data_flows:
  - id: in
    from_component: client
    to_component: ingress
    protocol: "HTTPS"
    encrypted: true
  - id: to_api
    from_component: ingress
    to_component: api
    protocol: "HTTP"
  - id: to_cache
    from_component: api
    to_component: cache
    protocol: "TCP"
  - id: to_db
    from_component: api
    to_component: db
    protocol: "TCP"
    encrypted: true

assets: []
threats: []
mitigations: []
evidence_suggestions: []
