  kind: process
  technology: OIDC
  in_trust_boundary: app_tier
- id: svc
  name: Serviço de domínio
  kind: process
  in_trust_boundary: app_tier
- id: store
  name: Armazenamento
  kind: datastore
  technology: S3/DB
  in_trust_boundary: app_tier
data_flows:
- id: u_api
  from_component: user
  to_component: api
  protocol: HTTPS
  encrypted: true
  authenticated: true
- id: api_auth
  from_component: api
  to_component: auth
  protocol: HTTPS
- id: api_svc
  from_component: api
  to_component: svc
  protocol: HTTPS
- id: svc_st
  from_component: svc
  to_component: store
