model:
  schema_version: 1.0.0
  methodology: stride
  system_type: mobile_application
  industry_sector: generic
metadata:
  title: Mobile + backend
  summary: Cliente móvel, API, identidade e armazenamento.
  tags:
  - template
  - mobile
business_context:
  description: Autenticação de utilizadores móveis e APIs de domínio.
  assumptions:
  - OAuth2/OIDC para sessão.
  - Armazenamento de objetos ou SQL conforme o caso.
trust_boundaries:
- id: internet
