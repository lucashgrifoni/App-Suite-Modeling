[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-threat-model"
version = "7.6.0"
description = "Plataforma open source de Threat Modeling as Code (core, API, CLI, UI)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Open Threat Model contributors" }]
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "python-multipart>=0.0.18",
  "uvicorn[standard]>=0.27",
  "slowapi>=0.1.9",
  # Reservado para persistência pós-MVP (multi-utilizador / histórico); a API atual não importa SQLAlchemy.
  "sqlalchemy>=2.0",
]
# click>=8.2: Typer subclasses click.Choice as generic; older Click raises "Choice is not subscriptable".
cli = ["typer>=0.12.3", "rich>=13.7", "click>=8.2"]
# PDF premium (xhtml2pdf); instalar com: pip install -e ".[report]"
report = ["xhtml2pdf>=0.2.15"]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.0",
  "httpx>=0.26",
  "ruff>=0.3",
  "mypy>=1.8",
  "types-PyYAML>=6.0.12",
  "xhtml2pdf>=0.2.15",
  "bandit>=1.7",
  # Tests import the CLI; align with [cli] Typer/Click constraints.
  "typer>=0.12.3",
  "click>=8.2",
]
# AST leve opcional para `scan_node_express_repo` (env `OTM_REPO_ESPRIMA=1`). Sem isto, mantém-se só heurística regex.
artifact_import_ast = ["esprima>=4.0.0,<5"]

[project.scripts]
otm = "otm_cli.main:main"

[tool.setuptools.packages.find]
where = [
  "packages/core-schema",
  "packages/explainability",
  "packages/threat-engine",
  "packages/framework-mappings",
  "packages/exporters",
  "packages/diagram-engine",
  "packages/industry-packs",
  "packages/artifact-import",
  "packages/report-premium",
  "apps/cli",
  "apps/api",
]

[tool.setuptools.package-data]
otm_industry_packs = ["data/**/*"]
otm_framework_mappings = ["data/**/*"]
otm_threat_engine = ["data/**/*"]
otm_report_premium = ["assets/*"]

[tool.coverage.run]
relative_files = true
source = ["packages", "apps"]
omit = ["*/tests/*", "*/__pycache__/*", "*/.venv/*"]

[tool.coverage.report]
# Standard, non-functional lines excluded from the coverage metric (universally accepted).
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/core-schema",
  "packages/explainability",
  "packages/threat-engine",
  "packages/framework-mappings",
  "packages/exporters",
  "packages/diagram-engine",
  "packages/industry-packs",
  "packages/artifact-import",
  "packages/report-premium",
  "apps/api",
  "scripts",
]

[tool.ruff]
# 120 alinha melhor com strings PT/descrições OpenAPI e reduz ruído E501; CI e formatação usam o mesmo limite.
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
show_error_codes = true
# Pacotes irmãos sem stubs: foco inicial em core-schema + API; expandir gradualmente.
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# Mensagens de inferência e docstrings PT-PT tendem a ultrapassar 100 carateres.
"packages/industry-packs/otm_industry_packs/catalog/registry_data.py" = ["E501"]
"packages/artifact-import/**" = ["E501"]
"packages/threat-engine/otm_threat_engine/remediation/**" = ["E501"]
"tests/test_artifact_import.py" = ["E501"]
