# Hooks published for downstream `pre-commit` users.
#
#   repos:
#     - repo: https://github.com/lucashgrifoni/App-Suite-Modeling
#       rev: v7.9.0
#       hooks:
#         - id: otm-validate
#
# `rev: v7.9.0` is a git TAG, and a tag can be moved by anyone who can push to this repository.
# This hook runs on your developers' machines, with their credentials, on every commit, so
# prefer the commit SHA — pre-commit accepts one, and `pre-commit autoupdate --freeze` writes
# that form for you:
#
#       rev: <40-character commit SHA>  # frozen: v7.9.0
#
# This repository holds itself to that rule: every GitHub Action it uses, and its own
# ruff hook in .pre-commit-config.yaml, are pinned to commit SHAs.
#
# `language: python` makes pre-commit install this project from `pyproject.toml` into its own
# isolated environment. That works without `additional_dependencies` because the CLI runtime
# (Typer, Rich, Click) is a base dependency, not an extra.

- id: otm-validate
  name: otm validate (threat model schema)
  description: >-
    Validate every changed .otm.yaml against the canonical schema, so a malformed threat model
    is caught at commit time instead of in CI.
  entry: otm validate
  language: python
  # pre-commit hands the hook every matching path at once, which is why `otm validate` takes
  # several files. Anchored on the `.otm.yaml` / `.otm.yml` suffix so ordinary YAML is untouched.
  files: \.otm\.ya?ml$
  pass_filenames: true
  minimum_pre_commit_version: "2.9.0"
