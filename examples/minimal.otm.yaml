# Exemplo mínimo — schema canônico OTM v1.1+
model:
  schema_version: "1.1.0"
  system_type: web_application
  industry_sector: saas

metadata:
  title: "Exemplo — API de pedidos"
  summary: "Serviço REST com fila e banco."
  owner: "equipe-plataforma"
  tags:
    - exemplo

trust_boundaries:
  - id: internet
    name: "Internet"
    boundary_scenario: boundary_client_to_server
  - id: vpc
    name: "Conta cloud / VPC"
    boundary_scenario: boundary_app_to_database
    member_component_ids:
      - api
      - worker
      - db

components:
  - id: user
    name: "Usuário"
    kind: user
    in_trust_boundary: internet
  - id: api
    name: "API"
    kind: process
    technology: "REST"
    responsibility: public_api
    in_trust_boundary: vpc
    asset_ids:
      - orders_data
  - id: worker
    name: "Worker"
    kind: process
    in_trust_boundary: vpc
  - id: db
    name: "Pedidos"
    kind: datastore
    technology: "PostgreSQL"
    in_trust_boundary: vpc
    has_direct_datastore_access: true
    asset_ids:
      - orders_data

data_flows:
  - id: http_in
    name: "HTTPS"
    from_component: user
    to_component: api
    protocol: "HTTPS"
    authenticated: true
    encrypted: true
    semantic_class: public_api_ingress_flow
    public_exposure: true
  - id: to_worker
    from_component: api
    to_component: worker
    protocol: "internal"
    semantic_class: gateway_forwarding_flow
  - id: to_db
    from_component: worker
    to_component: db
    protocol: "TCP"
    semantic_class: storage_processing_flow
    stores_sensitive_data: true

assets:
  - id: orders_data
    name: "Registos de pedidos"
    asset_kind: order_record
    data_classification: confidential
    business_criticality: high
    related_component_ids:
      - api
      - db
    related_data_flow_ids:
      - to_db
  - id: session_ctx
    name: "Contexto de sessão utilizador"
    asset_kind: session
    sensitivity: confidential
    business_criticality: medium
    related_component_ids:
      - api
threats: []
mitigations: []
evidence_suggestions: []
