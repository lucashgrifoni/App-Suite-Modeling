# SonarQube (local) ou SonarCloud — raiz do repositório.
#
# SonarCloud (obrigatório na nuvem):
#   - Crie variável de repositório GitHub: SONAR_ORGANIZATION (chave da org na página do projeto SonarCloud).
#   - Secret: SONAR_TOKEN (token de análise).
#   - O workflow .github/workflows/sonarcloud.yml passa -Dsonar.organization em cada execução.
#
# Scan local (SonarQube em localhost):
#   sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.token=...

sonar.projectKey=otm-app-suite-modeling
sonar.projectName=Threat Modeling (App Suite Modeling)

# Código de produção e documentação versionada (projeto completo).
sonar.sources=apps,packages,scripts,docs,gitpage,examples

# Testes só como testes (evita classificar pytest como código principal).
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Relatório Cobertura (gerado na CI antes do scan: pytest --cov ... --cov-report=xml:coverage.xml)
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=**/node_modules/**,**/.venv/**,**/__pycache__/**,**/dist/**,**/build/**,**/.pytest_cache/**,**/.mypy_cache/**,**/.playwright/**,**/playwright-report/**,**/coverage/**,**/*.min.js,**/package-lock.json,**/artifacts/**,**/fixtures/**,**/*.egg-info/**,**/.cursor/**

# CPD: ficheiros onde o plugin reportou offsets de linha inválidos (Python/TS).
sonar.cpd.exclusions=**/anti_pattern_library.py
