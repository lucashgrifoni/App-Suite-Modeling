# SonarQube Community / Developer — análise a partir da raiz do repositório.
#
# Uso típico (SonarQube em localhost, ex.: Tools em Windows):
#   1. Garantir o servidor em http://localhost:9000 (ex.: sonarqube-start.cmd).
#   2. Gerar cobertura Python antes do scan (opcional mas recomendado para métricas):
#        python -m pytest --cov=packages --cov=apps --cov-report=xml:coverage.xml -q
#   3. Executar o SonarScanner com token de utilizador:
#        -Dsonar.host.url=http://localhost:9000 -Dsonar.token=<token>
#
# O ficheiro em Tools (sonar-scanner.cmd) pode falhar com espaços no path do projeto;
# nesse caso use o JAR embutido como já documentado nas sessões anteriores.

sonar.projectKey=otm-app-suite-modeling
sonar.projectName=Threat Modeling (App Suite Modeling)

# Código de produção e documentação versionada (projeto completo).
sonar.sources=apps,packages,scripts,docs,gitpage,examples

# Testes só como testes (evita classificar pytest como código principal).
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Relatório Cobertura (Cobertura XML); gerar na raiz antes do scan (ver passo 2 acima).
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=**/node_modules/**,**/.venv/**,**/__pycache__/**,**/dist/**,**/build/**,**/.pytest_cache/**,**/.mypy_cache/**,**/.playwright/**,**/playwright-report/**,**/coverage/**,**/*.min.js,**/package-lock.json,**/artifacts/**,**/fixtures/**,**/*.egg-info/**,**/.cursor/**

# CPD: ficheiro onde o plugin Python reportou offset de linha inválido.
sonar.cpd.exclusions=**/anti_pattern_library.py
