sonar.projectKey=otm-app-suite-modeling
sonar.projectName=App Suite Modeling (OTM)
sonar.projectVersion=1.0

# Code lives under apps/ (api, cli, web) and packages/ (engines, schema, exporters, ...)
sonar.sources=apps,packages
sonar.tests=tests

# Noise / generated / local-only artifacts
sonar.exclusions=**/node_modules/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/*.pyc,**/dist/**,**/build/**,**/.mypy_cache/**,**/.pytest_cache/**,**/.ruff_cache/**,**/_analysis_outputs/**,**/artifacts/**,**/*.log,**/migrations/**

# Tests
sonar.test.inclusions=**/test_*.py,**/*_test.py,**/*.test.ts,**/*.test.tsx

# Python
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
# Coverage is measured for Python (coverage.xml). The web app (TS/TSX) has its own
# vitest suite but no lcov wired into Sonar, so it is excluded from the coverage metric
# (still analyzed for code-quality findings). __init__/conftest carry no testable logic.
# Also excluded from the coverage metric (still analyzed for findings):
#  - repo_ast_optional.py: only runs with the optional `esprima` extra (OTM_REPO_ESPRIMA=1).
#  - apps/cli/.../main.py: console-script entrypoint (`def main()`), exercised only as a process.
sonar.coverage.exclusions=**/tests/**,**/test_*.py,**/*_test.py,**/__init__.py,**/conftest.py,apps/web/**,**/*.ts,**/*.tsx,**/repo_ast_optional.py,**/otm_cli/main.py

sonar.sourceEncoding=UTF-8
