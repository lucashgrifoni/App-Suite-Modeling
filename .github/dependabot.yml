# Dependabot — atualização semanal de dependências (pip + npm).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Tailwind v4 exige @tailwindcss/postcss e migração de CSS; manter v3 até migração explícita.
    ignore:
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
