# Dependabot — atualização semanal de dependências (pip + npm).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Vite 8 exige @vitejs/plugin-react 6+; PRs separados geram ERESOLVE no npm ci.
    groups:
      vite-ecosystem:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
    # Tailwind v4 exige @tailwindcss/postcss e migração de CSS; manter v3 até migração explícita.
    ignore:
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      # openapi-typescript 7.x declara peer typescript@^5.x; TS 6 quebra npm ci (ERESOLVE).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /gitpage
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      vite-ecosystem:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
