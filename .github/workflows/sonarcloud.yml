# Análise SonarCloud com cobertura Python (Quality Gate: coverage, bugs, etc.).
#
# Pré-requisitos no repositório GitHub:
#   - Secret SONAR_TOKEN (SonarCloud → My Account → Security).
#   - Variável SONAR_ORGANIZATION (Settings → Secrets and variables → Actions → Variables):
#     chave da organização, igual à mostrada em SonarCloud no projeto (ex.: minha-org).
#
name: SonarCloud

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    if: github.event.repository.fork == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -e ".[dev,cli,api]"

      - name: Tests with coverage (Cobertura XML)
        run: python -m pytest --cov=packages --cov=apps --cov-report=xml:coverage.xml -q

      - name: Check SonarCloud variables
        env:
          SONAR_ORG: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          if [ -z "${SONAR_ORG:-}" ]; then
            echo "::error::Defina a variável de repositório SONAR_ORGANIZATION (chave da organização no SonarCloud)."
            exit 1
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
