# OpenSSF Scorecard
#
# Continuously scores the repository's security posture (branch protection,
# token permissions, pinned dependencies, dangerous workflow patterns, signed
# releases, and more) and publishes the results to GitHub code scanning.
#
# Repository prerequisites:
#   - Public repositories: no setup; results can be published to the public
#     OpenSSF REST API (`publish_results: true`) to earn a Scorecard badge.
#   - Private repositories: set `publish_results: false` (current setting).
#     SARIF upload to code scanning also requires GitHub Advanced Security on
#     private repositories.
#
# Supply-chain hardening:
#   - Third-party and first-party actions are pinned to immutable commit SHAs.
#   - The trailing comment records the semantic tag used to resolve the SHA.
#   - Keep `.github/dependabot.yml` enabled for `github-actions` so Dependabot
#     can refresh SHA pins through reviewable pull requests.
#
# Secrets: none (uses the short-lived GITHUB_TOKEN and OIDC via id-token).

name: OpenSSF Scorecard

on:
  # Re-score whenever branch protection rules change.
  branch_protection_rule:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    # OpenSSF Scorecard targets public OSS posture (and the badge / public API).
    # Skip gracefully while the repo is private; it re-activates when public.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Needed to upload SARIF results to code scanning.
      security-events: write
      # Needed to publish results and get a badge (OIDC).
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the public OpenSSF API to enable the badge.
          # Disabled here because the repository is private.
          publish_results: false

      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scorecard-results
          path: results.sarif
          if-no-files-found: error
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
          category: scorecard
