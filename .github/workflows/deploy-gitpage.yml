# Builds the marketing site in gitpage/ and deploys to GitHub Pages.
# Repository Settings → Pages → Source: GitHub Actions (required).

name: Deploy GitHub Pages

# Dispara em todo push em main/master para não depender de "ter mudado só gitpage/"
# (evita 404 quando o workflow existe mas nunca rodou por causa de filtro de paths).
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gitpage/package-lock.json

      - name: Install dependencies
        working-directory: gitpage
        run: npm ci

      - name: Build static site
        working-directory: gitpage
        run: npm run build

      # Obrigatório antes de upload-pages-artifact (contrato GitHub Pages / OIDC).
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gitpage/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
