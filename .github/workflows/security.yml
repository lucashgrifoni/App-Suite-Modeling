# Gates de segurança (OSS + Snyk) — escopo do repositório inteiro.
# Excluem-se só artefatos/deps: node_modules, .git, dist, .cursor (não são “fonte” a auditar).
#
# - SAST: Semgrep (tudo exceto exclusões); Snyk Code na raiz com SNYK_TOKEN
# - SCA + IaC: Trivy vuln + misconfig na raiz (.)
# - SCA Snyk: `snyk test --all-projects` na raiz (pip + npm no gitpage antes, para grafo correto)
# - Secrets: Gitleaks (histórico completo)
#
# Política: Trivy MEDIUM+; Snyk medium+; Semgrep WARNING+; sem continue-on-error.
# PRs de fork: job Snyk ignorado (sem secrets).
# O `name:` fica na 1.ª linha para a UI do GitHub e extensões (ex.: lista de workflows no editor) mostrarem "Security Gates".

name: Security Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_SEVERITY: "CRITICAL,HIGH,MEDIUM"
  # Trivy: diretórios a não atravessar (deps / metadados).
  TRIVY_SKIP_DIRS: ".git,gitpage/node_modules,node_modules,.cursor"

jobs:
  sast-semgrep:
    name: SAST — Semgrep (repo inteiro)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Semgrep
        run: pip install "semgrep>=1.90.0,<2"
      - name: Validar rule pack (repo inteiro, exceto deps/artefatos)
        run: |
          set -euo pipefail
          semgrep scan \
            --config rules/semgrep/appsec-runtime-footguns.yml \
            --validate \
            --exclude '**/node_modules/**' \
            --exclude '**/.git/**' \
            --exclude '**/dist/**' \
            --exclude '**/.cursor/**' \
            .
      - name: Scan — bloqueia WARNING e ERROR (repo inteiro)
        run: |
          set -euo pipefail
          semgrep scan \
            --config rules/semgrep/appsec-runtime-footguns.yml \
            --error \
            --severity WARNING \
            --metrics=off \
            --exclude '**/node_modules/**' \
            --exclude '**/.git/**' \
            --exclude '**/dist/**' \
            --exclude '**/.cursor/**' \
            .

  secrets-gitleaks:
    name: Secrets — Gitleaks (repo inteiro)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-sca-iac:
    name: SCA + IaC — Trivy (repo inteiro)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Vulnerabilidades em dependências (MEDIUM+)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: ${{ env.TRIVY_SEVERITY }}
          scanners: vuln
          skip-dirs: ${{ env.TRIVY_SKIP_DIRS }}
      - name: Misconfiguration (MEDIUM+)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: ${{ env.TRIVY_SEVERITY }}
          scanners: misconfig
          skip-dirs: ${{ env.TRIVY_SKIP_DIRS }}

  snyk-sca:
    name: Snyk — SAST (Code) + SCA (repo inteiro)
    if: >-
      ${{ secrets.SNYK_TOKEN != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python deps (resolução Snyk)
        run: pip install -r requirements-dev.txt
      - name: Setup Node (gitpage — lockfile npm do repo)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gitpage/package-lock.json
      - name: npm ci (gitpage)
        working-directory: gitpage
        run: npm ci
      - name: Optional Linux native bindings (alinhado ao CI)
        working-directory: gitpage
        run: npm install --no-save @rolldown/binding-linux-x64-gnu@1.0.0-rc.15 lightningcss-linux-x64-gnu@1.32.0
      - name: Install Snyk CLI
        uses: snyk/actions/setup@v1.0.0
      - name: Snyk Test — todos os manifestos detectados (MEDIUM+)
        run: snyk test --all-projects --severity-threshold=medium
      - name: Snyk Code — SAST (MEDIUM+, repo inteiro)
        run: snyk code test --severity-threshold=medium .
