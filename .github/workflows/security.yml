name: Security Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_SEVERITY: "CRITICAL,HIGH,MEDIUM"
  TRIVY_SKIP_DIRS: ".git,gitpage/node_modules,node_modules,.cursor"

jobs:
  sast-semgrep:
    name: SAST — Semgrep (repo inteiro)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install "semgrep>=1.90.0,<2"

      - name: Validar rule pack
        run: |
          set -euo pipefail
          semgrep scan \
            --config rules/semgrep/appsec-runtime-footguns.yml \
            --validate \
            --exclude '**/node_modules/**' \
            --exclude '**/.git/**' \
            --exclude '**/dist/**' \
            --exclude '**/.cursor/**' \
            .

      - name: Scan — bloqueia WARNING e ERROR
        run: |
          set -euo pipefail
          semgrep scan \
            --config rules/semgrep/appsec-runtime-footguns.yml \
            --error \
            --severity WARNING \
            --metrics=off \
            --exclude '**/node_modules/**' \
            --exclude '**/.git/**' \
            --exclude '**/dist/**' \
            --exclude '**/.cursor/**' \
            .

  secrets-gitleaks:
    name: Secrets — Gitleaks (repo inteiro)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-sca:
    name: SCA — Trivy (repo inteiro)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Vulnerabilidades em dependências (MEDIUM+)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: ${{ env.TRIVY_SEVERITY }}
          skip-dirs: ${{ env.TRIVY_SKIP_DIRS }}
          exit-code: "1"
          format: table

  trivy-iac:
    name: IaC — Trivy Misconfig (repo inteiro)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Misconfiguration (MEDIUM+)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          severity: ${{ env.TRIVY_SEVERITY }}
          skip-dirs: ${{ env.TRIVY_SKIP_DIRS }}
          exit-code: "1"
          format: table

  snyk-sca:
    name: Snyk — SAST (Code) + SCA (repo inteiro)
    if: ${{ secrets.SNYK_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Cairo build deps (pycairo)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python deps (resolução Snyk)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Setup Node (gitpage)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gitpage/package-lock.json

      - name: npm ci (gitpage)
        working-directory: gitpage
        run: npm ci

      - name: Optional Linux native bindings (alinhado ao CI)
        working-directory: gitpage
        run: |
          npm install --no-save @rolldown/binding-linux-x64-gnu@1.0.0-rc.15 lightningcss-linux-x64-gnu@1.32.0

      - name: Install Snyk CLI
        uses: snyk/actions/setup@v1.0.0

      - name: Snyk Test — todos os manifestos detectados (MEDIUM+)
        run: snyk test --all-projects --severity-threshold=medium

      - name: Snyk Code — SAST (MEDIUM+, repo inteiro)
        run: snyk code test --severity-threshold=medium .
