# Gate de segurança: falha do workflow se houver achados CRITICAL/HIGH (ou equivalente) em SAST, SCA, IaC, segredos e contrato de API.
# Observação: segredos expostos são tratados como falha em qualquer severidade (Gitleaks). Semgrep usa severidade ERROR como proxy de alto risco.
name: Security (Pipeline)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast-semgrep:
    name: SAST (Semgrep — ERROR)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
      - name: Semgrep (somente severidade ERROR)
        run: >-
          semgrep scan
          --config p/python
          --config p/typescript
          --config p/javascript
          --config p/react
          --severity ERROR
          --error
          packages
          apps/web/src

  sast-bandit:
    name: SAST (Bandit — HIGH+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Bandit
        run: pip install "bandit[toml]>=1.7"
      - name: Bandit (apenas HIGH)
        run: python -m bandit -r packages apps -lll -q

  sca-trivy-fs:
    name: SCA (Trivy FS — CRITICAL,HIGH)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: "."
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"

  # Opcional: exige SNYK_TOKEN em Secrets → Actions. Complementa o SCA com política Snyk (high = critical+high).
  sca-snyk:
    name: SCA (Snyk — high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        if: ${{ secrets.SNYK_TOKEN != '' }}
      - uses: actions/setup-python@v5
        if: ${{ secrets.SNYK_TOKEN != '' }}
        with:
          python-version: "3.12"
      - name: Dependências de build (Cairo / pycairo)
        if: ${{ secrets.SNYK_TOKEN != '' }}
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
      - name: Instalar projeto Python
        if: ${{ secrets.SNYK_TOKEN != '' }}
        run: pip install -e ".[dev,cli,api]"
      - uses: actions/setup-node@v6
        if: ${{ secrets.SNYK_TOKEN != '' }}
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Instalar dependências web
        if: ${{ secrets.SNYK_TOKEN != '' }}
        working-directory: apps/web
        run: npm ci
      - uses: snyk/actions/setup@v1.0.0
        if: ${{ secrets.SNYK_TOKEN != '' }}
      - name: Snyk test (falha em high e critical)
        if: ${{ secrets.SNYK_TOKEN != '' }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --severity-threshold=high --skip-unresolved

  iac-trivy:
    name: IaC (Trivy config — CRITICAL,HIGH)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: "."
          severity: CRITICAL,HIGH
          exit-code: "1"

  secrets-gitleaks:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api-contract:
    name: API (Spectral — falha em error)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Lint OpenAPI (regras OAS; problemas com severidade error quebram o build)
        run: npx --yes @stoplight/spectral-cli lint contracts/openapi.json --ruleset spectral:oas --fail-severity=error
