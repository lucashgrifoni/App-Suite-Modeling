# Security CI/CD
#
# Standard security pipeline covering:
#   - SAST          : Semgrep, Snyk Code, CodeQL
#   - SCA           : Snyk Open Source, Trivy (filesystem vuln), Dependency Review (PR)
#   - IaC / Pipeline: Trivy (misconfig), KICS (Checkmarx)
#   - Secrets       : Trivy (secret), Gitleaks (git history)
#   - Workflow lint : actionlint
#   - SBOM          : Trivy (CycloneDX), uploaded as a build artifact
#
# Adopted from the standard `security-ci-cd.yml` template. The only project
# adaptation is the extra Semgrep `--config rules/semgrep/appsec-runtime-footguns.yml`,
# which keeps this repository's custom runtime-footgun rule pack as a gate.
#
# Graceful degradation (why this pipeline stays honest in every context):
#   A `preflight` job computes two facts that GitHub does NOT let every event
#   know directly:
#     - code_scanning : true when the repo is PUBLIC or has GitHub Advanced
#                       Security enabled. SARIF upload, CodeQL, and Dependency
#                       Review only work then; on a private repo without GHAS
#                       they fail with "Resource not accessible by integration"
#                       / "Code scanning is not enabled".
#     - is_dependabot : true on Dependabot-authored runs, which receive a
#                       read-only token and NO repository secrets, so
#                       secret-dependent (Snyk) and security-events:write
#                       (SARIF upload, dependency-review) steps fail-closed.
#   The Snyk jobs additionally PROBE the token at `snyk auth` and split the two
#   failure classes:
#     - auth rejection (expired / deprovisioned -> SNYK-0005 / HTTP 401): the scan
#       structurally cannot run, so it SKIPS with a Step Summary note instead of
#       reddening every push. Rotate the secret to restore coverage.
#     - any other error (Snyk outage, 429 rate-limit, DNS/TLS): the scan COULD have
#       run, so the job FAILS CLOSED and loud. A transient error must never drop
#       Snyk coverage behind a green check.
#   Snyk stays a hard gate on real findings whenever the token authenticates.
#   The actual SCANNERS still hard-gate on real findings (Trivy exit-code,
#   Semgrep --error, Snyk threshold, KICS fail_on). Only the steps that
#   STRUCTURALLY cannot run in a given context are skipped, so a green run
#   means "no findings", not "scanner silently disabled". When the repo is
#   public (or GHAS is on), every upload runs and the Security tab is populated.
#
# Supply-chain hardening:
#   - Third-party and first-party actions are pinned to immutable commit SHAs.
#   - The trailing comment records the semantic tag used to resolve the SHA.
#   - Keep `.github/dependabot.yml` enabled for `github-actions` so Dependabot
#     can refresh SHA pins through reviewable pull requests.
#
# Harden-Runner egress:
#   - Start with `egress-policy: audit` for 2-4 weeks per repository.
#   - Review the Harden-Runner insights/recommended policy for each job.
#   - Then switch to `egress-policy: block` and add the observed
#     job-specific `allowed-endpoints` allowlist.
#   - Block-mode syntax:
#       egress-policy: block
#       allowed-endpoints: |
#         <observed-host>:443
#
# Semgrep severity mapping:
#   - WARNING = medium-severity findings
#   - ERROR   = high-severity findings
#
# Required repository or organization secrets (names only):
#   `SNYK_TOKEN`        for Snyk Code and Snyk Open Source scans.
#   `GITLEAKS_LICENSE`  only when the org uses the paid gitleaks-action license.
#
# GITHUB_TOKEN is supplied automatically by GitHub Actions.
# SARIF uploads require `security-events: write`. This permission is set at
# the workflow level and, when applicable, tightened at job level. On private
# repositories, SARIF upload and Dependency Review require GitHub Advanced
# Security; on public repositories both are free.

name: Security CI/CD

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
  merge_group:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  TRIVY_SEVERITY: "MEDIUM,HIGH,CRITICAL"
  TRIVY_SKIP_DIRS: ".git,node_modules,dist,build,coverage"
  SNYK_SEVERITY_THRESHOLD: "medium"

jobs:
  preflight:
    name: Preflight - context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      # 'true' when SARIF upload / CodeQL / Dependency Review can succeed
      # (public repo OR Advanced Security enabled), else 'false'.
      code_scanning: ${{ steps.ctx.outputs.code_scanning }}
      # 'true' on Dependabot-authored runs (read-only token, no secrets).
      is_dependabot: ${{ steps.ctx.outputs.is_dependabot }}
      # 'true' when a Snyk token is reachable in this context. Computed once here rather
      # than comparing the secret in each job's `if:`. KICS's Generic Token rule matches any
      # expression whose name contains `token` compared against a string literal, and flags it
      # HIGH. Hence the neutral name: honest to the scanner, and one source of truth for two jobs.
      snyk_enabled: ${{ steps.ctx.outputs.snyk_enabled }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Determine context
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "is_dependabot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_dependabot=false" >> "$GITHUB_OUTPUT"
          fi
          # Presence only. The value is never printed, and only its emptiness leaves this step.
          if [ -n "${SNYK_TOKEN}" ]; then
            echo "snyk_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "snyk_enabled=false" >> "$GITHUB_OUTPUT"
          fi
          # Visibility is always readable with the default token; Advanced
          # Security status may not be (defaults to empty -> treated as off).
          VIS="$(gh api "repos/$REPO" --jq '.visibility' 2>/dev/null || echo unknown)"
          GHAS="$(gh api "repos/$REPO" --jq '.security_and_analysis.advanced_security.status' 2>/dev/null || echo unknown)"
          if [ "$VIS" = "public" ] || [ "$GHAS" = "enabled" ]; then
            echo "code_scanning=true" >> "$GITHUB_OUTPUT"
          else
            echo "code_scanning=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### Security CI preflight"
            echo "- visibility: \`$VIS\`"
            echo "- advanced_security: \`$GHAS\`"
            echo "- dependabot: \`$ACTOR\`"
            echo ""
            echo "When code scanning is unavailable, SARIF-upload / CodeQL /"
            echo "Dependency-Review steps are skipped (not failed); scanners still gate."
          } >> "$GITHUB_STEP_SUMMARY"

  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Semgrep
        # Pinned to an exact version for reproducible scans. Bump deliberately
        # (or via Dependabot 'pip') rather than floating across releases.
        run: python -m pip install "semgrep==1.163.0"

      - name: Scan application and workflow code
        # `--severity` is a FILTER, and it is repeatable. A single `--severity WARNING`
        # therefore loaded ONLY warning-severity rules and silently dropped every
        # ERROR-severity (high) rule in the packs -- the gate ran, but never on the findings
        # it existed to catch. Verified: with one WARNING and one ERROR rule, the old flags
        # reported "1 Code rule"; with both severities, "2 Code rules".
        # The exit code is asserted explicitly rather than trusted: a security gate that
        # depends on a flag's side effect is one flag change away from passing everything.
        run: |
          set +e
          semgrep scan \
            --config p/security-audit \
            --config p/github-actions \
            --config rules/semgrep/appsec-runtime-footguns.yml \
            --severity WARNING \
            --severity ERROR \
            --sarif --output=semgrep.sarif \
            --error \
            --metrics=off \
            .
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::Semgrep gate failed (exit ${rc}): blocking findings, or the scan itself errored."
            exit "$rc"
          fi

      - name: Upload Semgrep SARIF
        # Best-effort: only when code scanning is available. The scan above is
        # the hard gate (--error); the upload only feeds the Security tab.
        if: ${{ always() && needs.preflight.outputs.code_scanning == 'true' }}
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sast-snyk-code:
    name: SAST - Snyk Code
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Snyk CLI
        # Snyk needs a token + repo secrets, which Dependabot runs do not get.
        if: ${{ needs.preflight.outputs.is_dependabot == 'false' && needs.preflight.outputs.snyk_enabled == 'true' }}
        run: npm install -g snyk

      - name: Report that Snyk cannot run without a token
        # A pull request from a fork gets no secrets, so SNYK_TOKEN is empty, the auth step
        # below is skipped, the scan step after it is skipped, and the job finishes GREEN
        # having scanned nothing. On a public repository that is precisely the pull request
        # you least want silently unscanned. Failing is not an option -- it would block every
        # external contribution over a secret the contributor cannot have -- so the job stays
        # green and says so loudly instead. A reviewer must never read this check as "scanned".
        if: ${{ needs.preflight.outputs.is_dependabot == 'false' && needs.preflight.outputs.snyk_enabled == 'false' }}
        run: |
          {
            echo "### Snyk did NOT run - no token in this context"
            echo ""
            echo "\`SNYK_TOKEN\` is empty, which normally means this run came from a fork's"
            echo "pull request: GitHub does not expose secrets to those. **This job being"
            echo "green does not mean Snyk scanned anything.**"
            echo ""
            echo "Snyk coverage for this change is obtained when a maintainer runs it on a"
            echo "branch in this repository."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Snyk skipped - no SNYK_TOKEN in this context (fork PR). This green check does NOT mean Snyk scanned."

      - name: Authenticate Snyk
        id: snyk_auth
        if: ${{ needs.preflight.outputs.is_dependabot == 'false' && needs.preflight.outputs.snyk_enabled == 'true' }}
        # Probe the token, and distinguish the two failure classes:
        #   - AUTH REJECTION (expired / deprovisioned token -> SNYK-0005 / HTTP 401):
        #     structurally cannot run. Skip the scan with a Step Summary note instead of
        #     reddening every push forever — same contract as the code-scanning gates above.
        #   - ANY OTHER failure (Snyk outage, 429 rate-limit, DNS/TLS/network): the gate
        #     COULD have run. Fail closed and loud, so a transient error never silently
        #     drops Snyk coverage behind a green check.
        # Snyk stays a hard gate on real findings whenever the token authenticates.
        run: |
          set +e
          auth_out="$(snyk auth "$SNYK_TOKEN" 2>&1)"
          auth_rc=$?
          set -e
          if [ "$auth_rc" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$auth_out" | grep -qiE 'SNYK-0005|401|authentication error|not recognized|not provisioned'; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Snyk Code skipped - SNYK_TOKEN not usable"
              echo "\`snyk auth\` was rejected (token present but unauthorized - expired or deprovisioned)."
              echo "Rotate the \`SNYK_TOKEN\` secret to restore Snyk coverage. Scan skipped, not failed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' "$auth_out"
            echo "::error::snyk auth failed for a non-authentication reason (exit ${auth_rc}). Failing closed so the Snyk gate is not silently dropped."
            exit "$auth_rc"
          fi

      - name: Run Snyk Code
        if: ${{ steps.snyk_auth.outputs.ok == 'true' }}
        run: >
          snyk code test
          --severity-threshold=${{ env.SNYK_SEVERITY_THRESHOLD }}
          --sarif-file-output=snyk-code.sarif

      - name: Upload Snyk Code SARIF
        if: ${{ always() && needs.preflight.outputs.code_scanning == 'true' && steps.snyk_auth.outputs.ok == 'true' }}
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

  sast-codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    needs: preflight
    # CodeQL writes results to code scanning; only runnable when available and
    # not on Dependabot's restricted token.
    if: ${{ needs.preflight.outputs.code_scanning == 'true' && needs.preflight.outputs.is_dependabot == 'false' }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: "/language:${{ matrix.language }}"

  sca-snyk:
    name: SCA - Snyk Open Source
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Snyk CLI
        if: ${{ needs.preflight.outputs.is_dependabot == 'false' && needs.preflight.outputs.snyk_enabled == 'true' }}
        run: npm install -g snyk

      - name: Report that Snyk cannot run without a token
        # A pull request from a fork gets no secrets, so SNYK_TOKEN is empty, the auth step
        # below is skipped, the scan step after it is skipped, and the job finishes GREEN
        # having scanned nothing. On a public repository that is precisely the pull request
        # you least want silently unscanned. Failing is not an option -- it would block every
        # external contribution over a secret the contributor cannot have -- so the job stays
        # green and says so loudly instead. A reviewer must never read this check as "scanned".
        if: ${{ needs.preflight.outputs.is_dependabot == 'false' && needs.preflight.outputs.snyk_enabled == 'false' }}
        run: |
          {
            echo "### Snyk did NOT run - no token in this context"
            echo ""
            echo "\`SNYK_TOKEN\` is empty, which normally means this run came from a fork's"
            echo "pull request: GitHub does not expose secrets to those. **This job being"
            echo "green does not mean Snyk scanned anything.**"
            echo ""
            echo "Snyk coverage for this change is obtained when a maintainer runs it on a"
            echo "branch in this repository."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Snyk skipped - no SNYK_TOKEN in this context (fork PR). This green check does NOT mean Snyk scanned."

      - name: Authenticate Snyk
        id: snyk_auth
        if: ${{ needs.preflight.outputs.is_dependabot == 'false' && needs.preflight.outputs.snyk_enabled == 'true' }}
        # Same two-class probe as the Snyk Code job: skip only on a genuine auth
        # rejection; fail closed on any other error so an outage or rate-limit
        # cannot silently drop the Snyk gate behind a green check.
        run: |
          set +e
          auth_out="$(snyk auth "$SNYK_TOKEN" 2>&1)"
          auth_rc=$?
          set -e
          if [ "$auth_rc" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$auth_out" | grep -qiE 'SNYK-0005|401|authentication error|not recognized|not provisioned'; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Snyk Open Source skipped - SNYK_TOKEN not usable"
              echo "\`snyk auth\` was rejected (token present but unauthorized - expired or deprovisioned)."
              echo "Rotate the \`SNYK_TOKEN\` secret to restore Snyk coverage. Scan skipped, not failed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' "$auth_out"
            echo "::error::snyk auth failed for a non-authentication reason (exit ${auth_rc}). Failing closed so the Snyk gate is not silently dropped."
            exit "$auth_rc"
          fi

      - name: Run Snyk Open Source scan
        if: ${{ steps.snyk_auth.outputs.ok == 'true' }}
        run: >
          snyk test
          --all-projects
          --severity-threshold=${{ env.SNYK_SEVERITY_THRESHOLD }}
          --sarif-file-output=snyk-oss.sarif

      - name: Upload Snyk Open Source SARIF
        if: ${{ always() && needs.preflight.outputs.code_scanning == 'true' && steps.snyk_auth.outputs.ok == 'true' }}
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: snyk-oss.sarif
          category: snyk-oss

  sca-trivy:
    name: SCA - Trivy
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      # Bloqueia em dependências de RUNTIME. Trivy exclui dev-dependencies por omissão ao ler um
      # `package-lock.json`, e isso não estava escrito em lado nenhum: o gate ficava verde tendo
      # olhado para 96 dos 466 pacotes npm. Medido — `trivy fs` em `apps/web` devolve 0
      # CRITICAL/HIGH por omissão e 1 com `--include-dev-deps`, e esse 1 é um advisory com
      # correção disponível. Verde significava "não olhámos", não "não há nada".
      - name: Scan runtime dependencies for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-deps.sarif
          skip-dirs: ${{ env.TRIVY_SKIP_DIRS }}

      # As dev-dependencies são analisadas e **reportadas**, não bloqueadas, e a distinção é
      # deliberada: o que corre na máquina de quem desenvolve e no runner é risco real de cadeia
      # de suprimentos, mas não é o mesmo risco de um pacote que vai no `dist/`. Bloquear os dois
      # com o mesmo limiar troca um ponto cego por um gate que grita — e um advisory que não é
      # entregue a ninguém passaria a impedir merges. O que não é aceitável é o silêncio: o
      # resultado vai para o Step Summary de qualquer forma.
      # Chamado directamente, e não através da action: `trivy-action` **não tem** um input de
      # flags livres — a primeira versão deste passo passou-lhe `trivy-flags`, que a action ignora
      # em silêncio, e o resultado teria sido um passo com ar de funcionar a analisar exactamente
      # o mesmo que o anterior. O binário está no PATH porque a action acima corre
      # `aquasecurity/setup-trivy`.
      #
      # Sem `continue-on-error`: `--exit-code 0` faz com que os *findings* não falhem o passo, mas
      # um trivy ausente ou um erro de invocação falham — que é a diferença entre "não há nada" e
      # "não corremos".
      - name: Scan dev dependencies (report only)
        shell: bash
        run: |
          trivy fs . \
            --scanners vuln \
            --severity "${TRIVY_SEVERITY}" \
            --ignore-unfixed \
            --include-dev-deps \
            --exit-code 0 \
            --format table \
            --output trivy-dev-deps.txt \
            --skip-dirs "${TRIVY_SKIP_DIRS}"

      - name: Report dev-dependency findings
        if: ${{ always() }}
        run: |
          {
            echo "### Trivy — dev dependencies (report only)"
            echo
            echo "Não bloqueia o merge. Bloqueiam apenas as dependências de runtime, no passo acima."
            echo
            if [ -s trivy-dev-deps.txt ]; then
              echo '```'
              cat trivy-dev-deps.txt
              echo '```'
            else
              echo "Sem findings ao nível ${TRIVY_SEVERITY} com correção disponível."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy dependency SARIF
        if: ${{ always() && needs.preflight.outputs.code_scanning == 'true' }}
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-deps.sarif
          category: trivy-deps

  iac-and-pipeline-trivy:
    name: IaC and Pipeline - Trivy
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Scan IaC and workflow misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: "1"
          format: sarif
          output: trivy-iac.sarif
          skip-dirs: ${{ env.TRIVY_SKIP_DIRS }}

      - name: Upload Trivy IaC SARIF
        if: ${{ always() && needs.preflight.outputs.code_scanning == 'true' }}
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

  iac-kics:
    name: IaC - KICS (Checkmarx)
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Scan IaC with KICS
        uses: Checkmarx/kics-github-action@05aa5eb70eede1355220f4ca5238d96b397e30a6 # v2.1.20
        with:
          path: "."
          output_path: kics-results
          output_formats: sarif
          fail_on: medium,high,critical
          enable_comments: false
          enable_annotations: false
          exclude_paths: ".git,node_modules,dist,build,coverage"

      - name: Upload KICS SARIF
        if: ${{ always() && needs.preflight.outputs.code_scanning == 'true' }}
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: kics-results/results.sarif
          category: kics

  secrets-trivy:
    name: Secrets - Trivy
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Scan repository files for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: "1"
          format: sarif
          output: trivy-secrets.sarif
          skip-dirs: ${{ env.TRIVY_SKIP_DIRS }}

      - name: Upload Trivy secrets SARIF
        if: ${{ always() && needs.preflight.outputs.code_scanning == 'true' }}
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-secrets.sarif
          category: trivy-secrets

  secrets-history-gitleaks:
    name: Secrets History - Gitleaks
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan git history for leaked secrets
        # Dependabot's restricted token cannot drive gitleaks-action's PR API
        # calls; history is already gated on push/schedule runs to main.
        if: ${{ needs.preflight.outputs.is_dependabot == 'false' }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  dependency-review:
    name: SCA - Dependency Review (PR)
    runs-on: ubuntu-latest
    needs: preflight
    # Dependency Review needs code scanning APIs (GHAS on private repos) and a
    # writable token, which Dependabot PRs do not have.
    if: ${{ github.event_name == 'pull_request' && needs.preflight.outputs.code_scanning == 'true' && needs.preflight.outputs.is_dependabot == 'false' }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Review new dependencies introduced by the pull request
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # Opt-in license policy. Tailor to your project and enable ONE of the
          # two lines below (allow-list is stricter and recommended).
          # allow-licenses: "MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC"
          # deny-licenses: "GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1"

  sbom:
    name: SBOM - CycloneDX
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
          skip-dirs: ${{ env.TRIVY_SKIP_DIRS }}

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

  workflow-lint:
    name: Workflow Lint - actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        uses: devops-actions/actionlint@9fb9c192862f19e684586ca84b500461bcd8a541 # v0.1.12
