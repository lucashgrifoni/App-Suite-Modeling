# Deploy GitHub Pages
#
# Publishes the static landing site (built from `gitpage/`) to GitHub Pages.
# Adapted from the standard `deploy-github-pages.yml` template: same hardening,
# SHA-pinned actions, and Pages contract, but the build runs inside `gitpage/`
# (there is no root package.json) and uploads `gitpage/dist`.
#
# Repository prerequisites:
#   - Settings > Pages > Build and deployment > Source: "GitHub Actions".
#
# Supply-chain hardening:
#   - Third-party and first-party actions are pinned to immutable commit SHAs.
#   - The trailing comment records the semantic tag used to resolve the SHA.
#   - Keep `.github/dependabot.yml` enabled for `github-actions` so Dependabot
#     can refresh SHA pins through reviewable pull requests.
#
# Secrets: none (uses the short-lived GITHUB_TOKEN via id-token: write).

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize Pages deployments. cancel-in-progress is false so an in-flight
  # production deployment is allowed to finish instead of being aborted by a
  # newer run, per GitHub Pages guidance.
  group: pages-${{ github.workflow }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PAGES_DIR: "gitpage"
  OUTPUT_DIR: "gitpage/dist"

jobs:
  build:
    name: Build GitHub Pages artifact
    # GitHub Pages publishing is unavailable on user-owned private repositories.
    # Skip the whole pipeline gracefully while private (deploy `needs: build`, so
    # it skips too); it re-activates automatically when the repo is public.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.PAGES_DIR }}/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install dependencies
        working-directory: ${{ env.PAGES_DIR }}
        run: npm ci

      - name: Build static site
        working-directory: ${{ env.PAGES_DIR }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ env.OUTPUT_DIR }}

  deploy:
    name: Deploy artifact
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
