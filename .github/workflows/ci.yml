name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,cli,api]"
      - name: Ruff
        run: ruff check packages apps tests
      - name: Tests
        run: python -m pytest
      - name: Smoke suite
        run: python -m pytest tests/test_smoke_release_candidate.py

  web:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install & build UI
        working-directory: apps/web
        run: |
          npm ci
      - name: UI build (standard)
        if: runner.os != 'Windows'
        working-directory: apps/web
        run: npm run ci:build
      - name: UI build (portable/windows)
        if: runner.os == 'Windows'
        working-directory: apps/web
        run: npm run ci:build:portable
