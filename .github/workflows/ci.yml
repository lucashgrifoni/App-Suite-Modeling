# CI: lint, typecheck, testes e build da UI — sem gates de segurança duplicados (ver security.yml).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, testes)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # xhtml2pdf (extra dev/report) → svglib → pycairo: precisa de headers Cairo no Linux (sem wheel manylinux).
      - name: Install Cairo build deps (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
      - name: Install
        run: pip install -e ".[dev,cli,api]"
      - name: Ruff (lint)
        run: ruff check packages apps tests
      - name: Ruff (format)
        run: ruff format --check packages apps tests
      - name: Mypy (monorepo)
        run: |
          mypy \
            packages/core-schema/otm_core_schema \
            apps/api/otm_api \
            packages/explainability/otm_explainability \
            packages/framework-mappings/otm_framework_mappings \
            packages/diagram-engine/otm_diagram_engine \
            apps/cli/otm_cli \
            packages/exporters/otm_exporters \
            packages/artifact-import/otm_artifact_import \
            packages/report-premium/otm_report_premium \
            packages/threat-engine/otm_threat_engine \
            packages/industry-packs/otm_industry_packs
      - name: Core vs adapter import boundary
        run: python scripts/check_core_adapter_boundary.py
      - name: OpenAPI contract not stale
        run: python scripts/verify_openapi_up_to_date.py
      - name: Tests
        run: python -m pytest
      - name: Smoke suite
        run: python -m pytest tests/test_smoke_release_candidate.py

  web:
    name: Web (build multi-OS)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install & build UI
        working-directory: apps/web
        run: |
          npm ci
      - name: UI build (standard)
        if: runner.os != 'Windows'
        working-directory: apps/web
        run: npm run ci:build
      - name: UI build (portable/windows)
        if: runner.os == 'Windows'
        working-directory: apps/web
        run: npm run ci:build:portable

  web-e2e-smoke:
    name: E2E smoke (UI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install Playwright browser
        working-directory: apps/web
        run: node ./node_modules/@playwright/test/cli.js install chromium
      - name: Run UI smoke E2E
        working-directory: apps/web
        run: npm run e2e:smoke:portable

  web-e2e-critical:
    name: E2E critical (mock stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install Playwright browser
        working-directory: apps/web
        run: node ./node_modules/@playwright/test/cli.js install chromium
      - name: E2E critical (mock stack)
        working-directory: apps/web
        run: npm run e2e:critical

  hybrid-e2e:
    name: E2E híbrido (API real + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Cairo build deps (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
      - name: Install Python packages
        run: pip install -e ".[dev,cli,api]"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web and Playwright
        working-directory: apps/web
        run: |
          npm ci
          node ./node_modules/@playwright/test/cli.js install chromium
      - name: Hybrid E2E (real API + Vite)
        working-directory: apps/web
        env:
          CI: "true"
        run: npm run e2e:hybrid
