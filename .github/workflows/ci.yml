name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # xhtml2pdf (extra dev/report) → svglib → pycairo: precisa de headers Cairo no Linux (sem wheel manylinux).
      - name: Install Cairo build deps (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
      - name: Install
        run: pip install -e ".[dev,cli,api]"
      - name: Ruff
        run: ruff check packages apps tests
      - name: Mypy (core-schema + API)
        run: mypy packages/core-schema/otm_core_schema apps/api/otm_api
      # pip-audit 2.x não expõe `--fail-on=critical`; qualquer CVE/OSV conhecido falha o job (gate estrito).
      - name: pip-audit (supply chain)
        run: pip install "pip-audit>=2.7" && python -m pip_audit --desc on -S .
      - name: Core vs adapter import boundary
        run: python scripts/check_core_adapter_boundary.py
      - name: OpenAPI contract not stale
        run: python scripts/verify_openapi_up_to_date.py
      - name: Tests
        run: python -m pytest
      - name: Smoke suite
        run: python -m pytest tests/test_smoke_release_candidate.py

  web:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install & build UI
        working-directory: apps/web
        run: |
          npm ci
      - name: npm audit (critical)
        working-directory: apps/web
        run: npm audit --audit-level=critical
      - name: UI build (standard)
        if: runner.os != 'Windows'
        working-directory: apps/web
        run: npm run ci:build
      - name: UI build (portable/windows)
        if: runner.os == 'Windows'
        working-directory: apps/web
        run: npm run ci:build:portable

  web-e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install Playwright browser
        working-directory: apps/web
        run: node ./node_modules/@playwright/test/cli.js install chromium
      - name: Run UI smoke E2E
        working-directory: apps/web
        run: npm run e2e:smoke:portable

  web-e2e-critical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install Playwright browser
        working-directory: apps/web
        run: node ./node_modules/@playwright/test/cli.js install chromium
      - name: E2E critical (mock stack)
        working-directory: apps/web
        run: npm run e2e:critical

  hybrid-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Cairo build deps (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
      - name: Install Python packages
        run: pip install -e ".[dev,cli,api]"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web and Playwright
        working-directory: apps/web
        run: |
          npm ci
          node ./node_modules/@playwright/test/cli.js install chromium
      - name: Hybrid E2E (real API + Vite)
        working-directory: apps/web
        env:
          CI: "true"
        run: npm run e2e:hybrid
